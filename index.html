<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b12">
  <meta name="description" content="Aura AI — a thoughtful assistant for your ideas and questions.">
  <title>Aura AI — Your thoughtful AI assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Aura AI home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>Aura <strong>AI</strong></span>
      </a>
      <div class="assistant-status"><span class="status-dot"></span> Assistant ready</div>
    </header>

    <main class="main-content">
      <section class="welcome" id="welcome" aria-labelledby="welcome-title">
        <div class="welcome-icon" aria-hidden="true"><span class="brand-mark"><span></span><span></span><span></span><span></span></span></div>
        <p class="eyebrow">YOUR AI ASSISTANT</p>
        <h1 id="welcome-title">Hello! How can I help<br class="desktop-break"> you today?</h1>
        <p class="welcome-copy">Ask me anything. I'm here to help you think, create, and get things done.</p>
      </section>

      <section class="chat-panel" aria-label="Chat conversation">
        <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div>
      </section>

      <form class="composer" id="chat-form">
        <label class="sr-only" for="message-input">Your message</label>
        <textarea id="message-input" rows="1" placeholder="Message Aura AI..." maxlength="2000" required></textarea>
        <div class="composer-footer">
          <span class="input-hint"><kbd>Enter</kbd> to send <span class="hint-divider">·</span> <kbd>Shift + Enter</kbd> for a new line</span>
          <button class="send-button" id="send-button" type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0L6 11m6-6 6 6"/></svg>
          </button>
        </div>
      </form>
      <p class="fine-print">Aura AI can make mistakes. Check important information.</p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
